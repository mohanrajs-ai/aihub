services:
  postgres-user:
    image: postgres:16-alpine
    container_name: geapphub-postgres-user
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_USER_DB:-geapphub_user}
    ports:
      - "${POSTGRES_USER_PORT:-5432}:5432"
    volumes:
      - geapphub_user_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_USER_DB:-geapphub_user}"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-admin:
    image: postgres:16-alpine
    container_name: geapphub-postgres-admin
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_ADMIN_DB:-geapphub_admin}
    ports:
      - "${POSTGRES_ADMIN_PORT:-5433}:5432"
    volumes:
      - geapphub_admin_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ADMIN_USER:-postgres} -d ${POSTGRES_ADMIN_DB:-geapphub_admin}"]
      interval: 5s
      timeout: 5s
      retries: 5

  user-portal:
    build:
      context: .
      dockerfile: Dockerfile.user
    container_name: geapphub-user-portal
    restart: unless-stopped
    depends_on:
      postgres-user:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres-user:5432/${POSTGRES_USER_DB:-geapphub_user}
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-cymbal-app-514110}
      USE_MOCK_DATA: ${USE_MOCK_DATA:-false}
      SYNC_ENABLED: "false"
    ports:
      - "${USER_PORTAL_PORT:-8080}:8080"

  admin-console:
    build:
      context: .
      dockerfile: Dockerfile.admin
    container_name: geapphub-admin-console
    restart: unless-stopped
    depends_on:
      postgres-admin:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_ADMIN_USER:-postgres}:${POSTGRES_ADMIN_PASSWORD:-postgres}@postgres-admin:5432/${POSTGRES_ADMIN_DB:-geapphub_admin}
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-cymbal-app-514110}
      USE_MOCK_DATA: ${USE_MOCK_DATA:-false}
      SYNC_ENABLED: ${SYNC_ENABLED:-true}
    ports:
      - "${ADMIN_CONSOLE_PORT:-8082}:8082"

volumes:
  geapphub_user_pgdata:
  geapphub_admin_pgdata:
