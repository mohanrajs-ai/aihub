# Cloud Build pipeline for building and pushing the Standalone User Portal image
# Usage (from inside user-portal/):
#   gcloud builds submit --config=cloudbuild.yaml --project="${GCP_PROJECT_ID}"

substitutions:
  _REGION: us-central1
  _AR_REPO: ge-user-portal-repo
  _IMAGE_NAME: ge-user-portal
  _TAG: latest

steps:
  - id: build-user-portal-image
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_IMAGE_NAME}:${_TAG}
      - .

  - id: push-user-portal-image
    name: gcr.io/cloud-builders/docker
    waitFor:
      - build-user-portal-image
    args:
      - push
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_IMAGE_NAME}:${_TAG}

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_IMAGE_NAME}:${_TAG}

options:
  logging: CLOUD_LOGGING_ONLY
