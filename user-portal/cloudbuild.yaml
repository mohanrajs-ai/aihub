# ==============================================================================
# Cloud Build CI/CD Pipeline for Gemini AI Hub — Standalone User Portal
# - Validates the 2 Cloud Secret Manager secrets (ge-oauth-credentials & ge-ssl-certificate)
# - Builds & pushes container image directly to Google Artifact Registry
# - Optionally executes Terraform infrastructure deployment (_DEPLOY_INFRA=true)
# ==============================================================================

substitutions:
  _REGION: us-central1
  _AR_REPO: ge-user-portal-repo
  _IMAGE_NAME: ge-user-portal
  _TAG: latest
  _OAUTH_SECRET: ge-oauth-credentials
  _SSL_SECRET: ge-ssl-certificate
  _INTERNAL_DOMAIN_NAME: aihub.internal.corp
  _DEPLOY_INFRA: "false"

steps:
  # Stage 1: Verify the 2 secrets (OAuth JSON & SSL Bundle) in Google Cloud Secret Manager
  - id: verify-cloud-secrets
    name: gcr.io/cloud-builders/gcloud
    entrypoint: bash
    secretEnv:
      - GOOGLE_OAUTH_CREDENTIALS
      - SSL_BUNDLE_PEM
    args:
      - -c
      - |
        set -euo pipefail
        echo "[Stage 1] Verifying Cloud Secret Manager secrets ('${_OAUTH_SECRET}' & '${_SSL_SECRET}')..."
        if ! grep -q "client_id" <<<"$${GOOGLE_OAUTH_CREDENTIALS:-}" || ! grep -q "client_secret" <<<"$${GOOGLE_OAUTH_CREDENTIALS:-}"; then
          echo "ERROR: Secret '${_OAUTH_SECRET}' must contain JSON with both 'client_id' and 'client_secret'." >&2
          exit 1
        fi
        if ! grep -q "BEGIN CERTIFICATE" <<<"$${SSL_BUNDLE_PEM:-}" || ! grep -q "PRIVATE KEY" <<<"$${SSL_BUNDLE_PEM:-}"; then
          echo "ERROR: Secret '${_SSL_SECRET}' must contain both the PEM certificate and private key." >&2
          exit 1
        fi
        echo "Both secrets ('${_OAUTH_SECRET}' and '${_SSL_SECRET}') verified in Cloud Secret Manager."

  # Stage 2: Build multi-stage User Portal container image
  - id: build-user-portal-image
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    waitFor:
      - verify-cloud-secrets
    args:
      - -c
      - |
        set -euo pipefail
        REGION="${_REGION}"
        AR_REPO="${_AR_REPO}"
        IMAGE_NAME="${_IMAGE_NAME}"
        TAG="${_TAG}"
        IMAGE_URI="$${REGION:-us-central1}-docker.pkg.dev/${PROJECT_ID}/$${AR_REPO:-ge-user-portal-repo}/$${IMAGE_NAME:-ge-user-portal}:$${TAG:-latest}"
        LATEST_URI="$${REGION:-us-central1}-docker.pkg.dev/${PROJECT_ID}/$${AR_REPO:-ge-user-portal-repo}/$${IMAGE_NAME:-ge-user-portal}:latest"
        echo "[Stage 2] Building container image for Google Artifact Registry: $${IMAGE_URI}"
        docker build -f Dockerfile -t "$${IMAGE_URI}" -t "$${LATEST_URI}" .

  # Stage 3: Push container image to Google Artifact Registry
  - id: push-user-portal-image
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    waitFor:
      - build-user-portal-image
    args:
      - -c
      - |
        set -euo pipefail
        REGION="${_REGION}"
        AR_REPO="${_AR_REPO}"
        IMAGE_NAME="${_IMAGE_NAME}"
        TAG="${_TAG}"
        IMAGE_URI="$${REGION:-us-central1}-docker.pkg.dev/${PROJECT_ID}/$${AR_REPO:-ge-user-portal-repo}/$${IMAGE_NAME:-ge-user-portal}:$${TAG:-latest}"
        LATEST_URI="$${REGION:-us-central1}-docker.pkg.dev/${PROJECT_ID}/$${AR_REPO:-ge-user-portal-repo}/$${IMAGE_NAME:-ge-user-portal}:latest"
        echo "[Stage 3] Pushing container image to Google Artifact Registry: $${IMAGE_URI}"
        docker push "$${IMAGE_URI}"
        if [[ "$${IMAGE_URI}" != "$${LATEST_URI}" ]]; then
          docker push "$${LATEST_URI}"
        fi

  # Stage 4: Optional Terraform Infrastructure Deployment (_DEPLOY_INFRA=true)
  - id: terraform-deploy
    name: hashicorp/terraform:1.9
    entrypoint: sh
    waitFor:
      - push-user-portal-image
    args:
      - -c
      - |
        set -eu
        if [ "${_DEPLOY_INFRA}" != "true" ]; then
          echo "[Stage 4] Skipping in-build Terraform apply (_DEPLOY_INFRA=${_DEPLOY_INFRA})."
          exit 0
        fi
        REGION="${_REGION}"
        AR_REPO="${_AR_REPO}"
        IMAGE_NAME="${_IMAGE_NAME}"
        TAG="${_TAG}"
        IMAGE_URI="$${REGION:-us-central1}-docker.pkg.dev/${PROJECT_ID}/$${AR_REPO:-ge-user-portal-repo}/$${IMAGE_NAME:-ge-user-portal}:$${TAG:-latest}"
        echo "[Stage 4] Applying Terraform stack from deploy/terraform..."
        terraform -chdir=deploy/terraform init -input=false
        terraform -chdir=deploy/terraform apply -auto-approve -input=false \
          -var="project_id=${PROJECT_ID}" \
          -var="region=$${REGION:-us-central1}" \
          -var="ar_repo_id=$${AR_REPO:-ge-user-portal-repo}" \
          -var="container_image=$${IMAGE_URI}" \
          -var="oauth_secret_name=${_OAUTH_SECRET}" \
          -var="ssl_secret_name=${_SSL_SECRET}" \
          -var="internal_domain_name=${_INTERNAL_DOMAIN_NAME}"

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/${_OAUTH_SECRET}/versions/latest
      env: GOOGLE_OAUTH_CREDENTIALS
    - versionName: projects/$PROJECT_ID/secrets/${_SSL_SECRET}/versions/latest
      env: SSL_BUNDLE_PEM

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_IMAGE_NAME}:${_TAG}

options:
  logging: CLOUD_LOGGING_ONLY
