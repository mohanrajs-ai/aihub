# Cloud Build pipeline for building and pushing the Standalone User Portal image
# Usage (from inside user-portal/):
#   gcloud builds submit --config=cloudbuild.yaml --project="${GCP_PROJECT_ID}"

substitutions:
  _REGION: us-central1
  _AR_REPO: ge-user-portal-repo
  _IMAGE_NAME: ge-user-portal
  _TAG: latest

steps:
  - id: build-user-portal-image
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        REGION="${_REGION}"
        AR_REPO="${_AR_REPO}"
        IMAGE_NAME="${_IMAGE_NAME}"
        TAG="${_TAG}"
        IMAGE_URI="$${REGION:-us-central1}-docker.pkg.dev/${PROJECT_ID}/$${AR_REPO:-ge-user-portal-repo}/$${IMAGE_NAME:-ge-user-portal}:$${TAG:-latest}"
        echo "Building container image: $${IMAGE_URI}"
        docker build -f Dockerfile -t "$${IMAGE_URI}" .

  - id: push-user-portal-image
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    waitFor:
      - build-user-portal-image
    args:
      - -c
      - |
        REGION="${_REGION}"
        AR_REPO="${_AR_REPO}"
        IMAGE_NAME="${_IMAGE_NAME}"
        TAG="${_TAG}"
        IMAGE_URI="$${REGION:-us-central1}-docker.pkg.dev/${PROJECT_ID}/$${AR_REPO:-ge-user-portal-repo}/$${IMAGE_NAME:-ge-user-portal}:$${TAG:-latest}"
        echo "Pushing container image: $${IMAGE_URI}"
        docker push "$${IMAGE_URI}"

options:
  logging: CLOUD_LOGGING_ONLY
